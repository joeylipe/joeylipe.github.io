### Site Settings ###
title               : Joseph Lipe
description         : >-
  Using analytical thinking, technical skills, and creative problem-solving to build practical solutions.
baseurl             : ""
repository          : joeylipe/joeylipe.github.io
remote_theme        : yousinix/portfolYOU
open_new_tab        : false                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/404.html
  - pages/index.md


### Author Info ###
author:
  name              : Joseph Lipe
  image             : /assets/images/joseph-lipe-profile.jpg
  email             : Joseph.Lipe@protonmail.com
  github            : joeylipe
  linkedin          : joseph-lipe


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name


### Analytics ###
analytics:
  enabled: false


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
  

### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
